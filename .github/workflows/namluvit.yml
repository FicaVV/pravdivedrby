name: Namluvit příběhy

# Po změně textů v data/ namluví nové odstavce neuronovým hlasem a nahrávky uloží do audio/.
# Potřebuje v Settings → Secrets and variables → Actions jednu z variant:
#   Google: secret GOOGLE_TTS_API_KEY, volitelně variable GOOGLE_TTS_VOICE (výchozí cs-CZ-Chirp3-HD-Charon)
#   Azure:  secret AZURE_SPEECH_KEY + variable AZURE_SPEECH_REGION (např. swedencentral),
#           volitelně variable AZURE_VOICE (výchozí cs-CZ-AntoninNeural, ženský cs-CZ-VlastaNeural)
# Když jsou nastavené oba klíče, použije se Google (zpět na Azure: variable TTS_SLUZBA = azure).
# Spotřeba znaků Google se počítá v tools/tts-kvota.json (commituje se i po neúspěšném běhu)
# a přehled je v souhrnu každého běhu.

on:
  push:
    branches: [main]
    paths: ["data/**", "tools/namluvit.mjs"]
  workflow_dispatch:
    inputs:
      ukazky:
        description: "Jen ukázky všech českých hlasů (ke stažení, nic se neuloží do webu)"
        type: boolean
        default: false
      znovu:
        description: "Přegenerovat všechny nahrávky (např. po změně hlasu)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: namluvit
  cancel-in-progress: false

jobs:
  namluvit:
    runs-on: ubuntu-latest
    env:
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION || 'swedencentral' }}
      AZURE_VOICE: ${{ vars.AZURE_VOICE }}
      GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
      GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
      GOOGLE_TTS_VOICE: ${{ vars.GOOGLE_TTS_VOICE }}
      TTS_SLUZBA: ${{ vars.TTS_SLUZBA }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Zkontrolovat klíč
        id: klic
        run: |
          if [ -z "$AZURE_SPEECH_KEY" ] && [ -z "$GOOGLE_TTS_API_KEY" ] && [ -z "$GOOGLE_TTS_KEY" ]; then
            echo "::warning::Chybí secret GOOGLE_TTS_API_KEY i AZURE_SPEECH_KEY, předčítání zůstane na hlasu telefonu."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Ukázky hlasů
        if: steps.klic.outputs.ok == 'true' && inputs.ukazky
        run: node tools/namluvit.mjs --ukazky
      - uses: actions/upload-artifact@v4
        if: steps.klic.outputs.ok == 'true' && inputs.ukazky
        with:
          name: ukazky-hlasu
          path: ukazky/
      - name: ffmpeg pro dozvuk modlitby
        if: steps.klic.outputs.ok == 'true' && !inputs.ukazky
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Namluvit
        id: namluvit
        if: steps.klic.outputs.ok == 'true' && !inputs.ukazky
        run: node tools/namluvit.mjs ${{ inputs.znovu && '--znovu' || '' }}
      # běží i po chybě, aby se uložil stav počítadla kvóty (znaky se počítají i za nepovedené pokusy)
      - name: Uložit nahrávky, počítadlo kvóty a nasadit
        if: always() && steps.klic.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NAMLUVENO: ${{ steps.namluvit.outcome }}
        run: |
          git add -A audio
          [ -f tools/tts-kvota.json ] && git add tools/tts-kvota.json
          if git diff --cached --quiet; then echo "Beze změn."; exit 0; fi
          zvuk=$(git diff --cached --name-only -- audio | wc -l)
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if [ "$zvuk" -gt 0 ]; then git commit -m "Namluvené nahrávky příběhů"; else git commit -m "Počítadlo znaků Google TTS"; fi
          git push
          # commit z Actions sám nasazení nespustí, proto ručně
          if [ "$zvuk" -gt 0 ] && [ "$NAMLUVENO" = "success" ] && [ "${GITHUB_REF_NAME}" = "main" ]; then gh workflow run pages.yml --ref main; fi
