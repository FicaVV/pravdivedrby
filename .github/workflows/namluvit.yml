name: Namluvit příběhy

# Po změně textů v data/ namluví nové odstavce hlasem Google Cloud Text-to-Speech
# a nahrávky uloží do audio/. Potřebuje v Settings → Secrets and variables → Actions:
#   secret GOOGLE_TTS_KEY    (API klíč z Google Cloud, omezený jen na Cloud Text-to-Speech API)
# Volitelně variable GOOGLE_TTS_VOICE (výchozí cs-CZ-Chirp3-HD-Charon).

on:
  push:
    branches: [main]
    paths: ["data/**", "tools/namluvit.mjs"]
  workflow_dispatch:
    inputs:
      ukazky:
        description: "Jen ukázky všech českých hlasů (ke stažení, nic se neuloží do webu)"
        type: boolean
        default: false
      znovu:
        description: "Přegenerovat všechny nahrávky (např. po změně hlasu)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: namluvit
  cancel-in-progress: false

jobs:
  namluvit:
    runs-on: ubuntu-latest
    env:
      GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
      GOOGLE_TTS_VOICE: ${{ vars.GOOGLE_TTS_VOICE || 'cs-CZ-Chirp3-HD-Charon' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Zkontrolovat klíč
        id: klic
        run: |
          if [ -z "$GOOGLE_TTS_KEY" ]; then
            echo "::warning::Chybí secret GOOGLE_TTS_KEY, předčítání zůstane na hlasu telefonu."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Ukázky hlasů
        if: steps.klic.outputs.ok == 'true' && inputs.ukazky
        run: node tools/namluvit.mjs --ukazky
      - uses: actions/upload-artifact@v4
        if: steps.klic.outputs.ok == 'true' && inputs.ukazky
        with:
          name: ukazky-hlasu
          path: ukazky/
      - name: Namluvit
        if: steps.klic.outputs.ok == 'true' && !inputs.ukazky
        run: node tools/namluvit.mjs ${{ inputs.znovu && '--znovu' || '' }}
      - name: Uložit nahrávky a nasadit
        if: steps.klic.outputs.ok == 'true' && !inputs.ukazky
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A audio
          if git diff --cached --quiet; then echo "Beze změn."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Namluvené nahrávky příběhů"
          git push
          # commit z Actions sám nasazení nespustí, proto ručně
          if [ "${GITHUB_REF_NAME}" = "main" ]; then gh workflow run pages.yml --ref main; fi
