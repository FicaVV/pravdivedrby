name: Nasazení na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Sestavení a nasazení jsou dva joby: v jednom jobu deploy-pages občas nenašel
  # právě nahraný artefakt („No artifacts named github-pages were found“).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Připravit web
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js data audio icons img vendor _site/
      - name: Adresa pro hodnocení a statistiky (tajemství PD_ENDPOINT)
        env:
          PD_ENDPOINT: ${{ secrets.PD_ENDPOINT }}
        run: |
          node -e 'const e=(process.env.PD_ENDPOINT||"").trim(); require("fs").writeFileSync("_site/js/config.js", "window.PD_CONFIG = " + JSON.stringify({ endpoint: e, verze: process.argv[1] }) + ";\n"); console.log(e ? "odesílání zapnuté" : "PD_ENDPOINT chybí, odesílání vypnuté")' "${GITHUB_SHA::7}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
